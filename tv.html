<!doctype html>
<html lang="my">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050505">
  <title>Live TV • AR YONE Football</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;600;700;800&family=Oswald:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css"><link rel="stylesheet" href="player.css"><link rel="stylesheet" href="tv.css">
</head>
<body>
  <main class="tv-app">
    <header class="tv-top"><a href="index.html" aria-label="Back">‹</a><div><small>AR YONE FOOTBALL</small><h1>Live TV</h1></div><button id="addChannel">＋</button></header>
    <section class="tv-player"><div class="tv-screen"><video id="tvVideo" controls playsinline autoplay></video><div class="tv-placeholder" id="placeholder"><span>▶</span><b>Channel တစ်ခုရွေးပါ</b><small>အောက်က channel card ကိုနှိပ်ပြီး ကြည့်ရှုနိုင်ပါတယ်</small></div><div class="tv-loader" id="loader">ချိတ်ဆက်နေပါသည်…</div></div><div class="now-playing"><div class="on-air"><i></i> ON AIR</div><div><b id="nowTitle">AR YONE Live TV</b><small id="nowCategory">Choose a channel</small></div><button id="fullscreen">⛶</button></div></section>
    <div class="tv-tools"><label><span>⌕</span><input id="search" type="search" placeholder="Channel ရှာရန်…"></label><div class="categories" id="categories"></div></div>
    <div class="channel-heading"><div><h2>Channels</h2><small id="channelCount">0 channels</small></div><span>Live 24/7</span></div>
    <section class="channel-grid" id="channelGrid"></section>
  </main>

  <nav class="bottom"><a class="nav nav-link" href="index.html"><span>⚽</span>ဘောလုံး</a><a class="nav nav-link" href="scores.html"><span>☆</span>ရလဒ်</a><a class="nav nav-link active" href="tv.html"><span>▶</span>TV</a><a class="nav nav-link" href="sports.html"><span>🏆</span>အားကစား</a><a class="nav nav-link" href="news.html"><span>▤</span>သတင်း</a><a class="nav nav-link" href="settings.html"><span>⚙</span>ဆက်တင်</a></nav>

  <div class="channel-modal" id="channelModal"><form id="channelForm"><div class="form-head"><div><small>CUSTOM CHANNEL</small><h3>TV Channel ထည့်ရန်</h3></div><button type="button" id="closeForm">×</button></div><label>Channel Name<input id="channelName" required placeholder="ဥပမာ — My Sports TV"></label><label>Stream URL<input id="channelUrl" type="url" required placeholder="https://example.com/live.m3u8"></label><label>Logo URL<input id="channelLogo" type="url" placeholder="https://example.com/logo.png"></label><label>Category<select id="channelCategory"><option>Sports</option><option>News</option><option>Entertainment</option><option>Movies</option><option>Other</option></select></label><button class="form-save" type="submit">Channel သိမ်းမည်</button></form></div>
  <div class="toast" id="toast"></div><script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.13/dist/hls.min.js"></script><script src="channels.js"></script><script src="tv.js"></script>
</body>
</html>
