<!doctype html>
<html lang="my">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050505">
  <title>Football Scores • AR YONE Football</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css"><link rel="stylesheet" href="player.css"><link rel="stylesheet" href="scores.css">
</head>
<body>
  <main class="scores-app">
    <header class="scores-top"><a href="index.html">‹</a><div><small>AR YONE FOOTBALL</small><h1>ရလဒ်များ</h1></div><button id="scoreRefresh">↻</button></header>
    <section class="score-hero"><div><span>LIVE SCORE CENTER</span><h2>Every goal.<br>Every match.</h2><p>ကမ္ဘာတစ်ဝန်း ဘောလုံးပွဲစဉ်ရလဒ်များ</p></div><b>⚽</b></section>
    <div class="date-nav"><button id="prevDate">‹</button><label><small id="dateLabel">TODAY</small><input id="scoreDate" type="date"></label><button id="nextDate">›</button></div>
    <nav class="score-tabs"><button class="active" data-status="all">All</button><button data-status="live"><i></i> Live</button><button data-status="finished">Finished</button><button data-status="upcoming">Upcoming</button></nav>
    <div class="score-summary"><div><h2>Matches</h2><small id="scoreUpdated">ရလဒ်များ ရယူနေပါသည်…</small></div><strong id="scoreCount">0</strong></div>
    <section id="scoreList" class="score-list"><div class="score-skeleton"></div><div class="score-skeleton"></div><div class="score-skeleton"></div></section>
  </main>
  <nav class="bottom"><a class="nav nav-link" href="index.html"><span>⚽</span>ဘောလုံး</a><a class="nav nav-link active" href="scores.html"><span>★</span>ရလဒ်များ</a><a class="nav nav-link" href="tv.html"><span>▶</span>Live TV</a><a class="nav nav-link" href="news.html"><span>▤</span>သတင်း</a><a class="nav nav-link" href="settings.html"><span>⚙</span>ဆက်တင်</a></nav>
  <div class="toast" id="toast"></div><script src="scores.js"></script>
</body>
</html>
